name: Refresh model benchmark metadata

on:
  schedule:
    # Weekly keeps pricing and provider metadata current without creating noisy churn.
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-model-benchmarks
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Refresh OpenRouter metadata
        run: python model-benchmarks/scripts/fetch-model.py --refresh --no-aa

      - name: Test benchmark pipeline
        run: python -m unittest discover -s model-benchmarks/tests

      - name: Publish changes
        run: |
          if git diff --quiet -- model-benchmarks/data/model-data.json model-benchmarks/llms.txt; then
            echo "Model metadata is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add model-benchmarks/data/model-data.json model-benchmarks/llms.txt
          git commit -m "chore(benchmarks): refresh model metadata"
          git push
